<!DOCTYPE html>
<html lang="pt-BR">
<head>

</head>
<body>
    <div style="max-width: 400px; margin: 50px auto; font-family: Arial, sans-serif;">
        <h2>Nova Senha</h2>
        <p>Digite sua nova senha abaixo:</p>
        
        <input type="password" id="new-password" placeholder="Nova senha" style="width: 100%; padding: 10px; margin-bottom: 10px;">
        <button onclick="updatePassword()" style="width: 100%; padding: 10px; background: #0070f3; color: white; border: none; cursor: pointer;">Salvar Nova Senha</button>
        
        <p id="status" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script>
        // Inicialize o Supabase com suas credenciais do projeto
        const SUPABASE_URL = 'https://naxchqkulvlwygwswdpe.supabase.co'; 
        const SUPABASE_PUBLISHABLE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5heGNocWt1bHZsd3lnd3N3ZHBlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNzUzNDcsImV4cCI6MjEwMjY1MTM0N30.BnR7931CxYIHLS5lRji76qWRLeq2d8ZNLF_x_dMxIrE'; 
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function updatePassword() {
            const newPassword = document.getElementById('new-password').value;
            const statusEl = document.getElementById('status');

            if (!newPassword || newPassword.length < 6) {
                statusEl.style.color = 'red';
                statusEl.innerText = 'A senha precisa ter pelo menos 6 caracteres.';
                return;
            }

            // O Supabase já sabe quem é o usuário por causa do token na URL
            const { data, error } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                statusEl.style.color = 'red';
                statusEl.innerText = 'Erro ao atualizar: ' + error.message;
            } else {
                statusEl.style.color = 'green';
                statusEl.innerText = 'Senha alterada com sucesso! Você já pode fechar esta página.';
            }
        }
    </script>
</body>
